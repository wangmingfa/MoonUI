# 设计文档 §48 第 22/23/24 步：Windows、macOS、Linux 三平台 CI。
#
# 当前门禁的是 Core + MockBackend 这一层（§37 第一层）：布局、事件、句柄生命周期、
# Demo 全链路，加上 tests/ffi 这个自包含的 native FFI 探针（§48-02）。另外两个 job
# 都不做 native 链接：core 的清单压根没列 backends，core-portability 列了但走 wasm——
# 后端包的 .mbt 全部门控成 native，wasm 侧它们是空包，这正是 §47"Core 里不许出现
# GUI 库名字"要的证明。
#
# backends/ 下的真后端进闸门的形状两侧不同（2026-10-14 起）：
# `macos-backend-link` **真跑**真窗口的测试——`backends/native-macos`（原生 Cocoa
# 后端，14 条），examples/gallery-native 仍然只连不跑（它要真人关窗口才退出）；
# `windows-backend-link` 自 `T78`（2026-10-22）起同样**真跑** `backends/native-windows`
# （Win32 后端，36 条），gallery-native 仍只连不跑。`T82`（2026-10-15）删 libui 之后：
# build-libui.sh/.ps1 现编步、vendored 头
# 的 pin 闸门、六份 `-libui` 壳整体退场，链接参数只剩 prebuild-link.js 一份来源。
# mac 那批测试里的脚手架不需要前台归属也不动真光标（命中之后是往控件**直接投消
# 息**：BM_CLICK / SendMessageW(WM_CHAR) / PostMessageW(WM_CLOSE)，全仓库没有
# SendInput / SetCursorPos），真正可能卡住它们的只有 NSApplication 那一层——无头
# runner 上有没有能连上 WindowServer 的会话，本机（有屏、有桌面）答不出，job 第一次
# 真跑（本仓库没有 remote，要推上去才发生）如果红在起不来 NSApplication，退路是把
# 那两步换回 --build-only（T6 记着这条退路）。Windows 侧同理：runner 上起不起得来
# 真窗口没量过，退路同款（T78 记着）；hosted Windows runner 惯例带交互会话，且
# Windows 测试全部用 SendMessage/PostMessage 直投、不等真输入，大概率绿。
#
# Windows 这半的工具链装配：`ilammy/msvc-dev-cmd` 把 MSVC 的 bin 排到 PATH 前头
# （Git for Windows 的 coreutils `link.exe` 抢在 MSVC 链接器前面会让链接期的 cl
# 调用认错链接器，T11 量过；meson 那段随 build-libui.ps1 删掉）。adapter_native.c
# 由 prebuild-link.js 现编，编不出来时链接自己红、stderr 有完整构建日志。
#
# MoonBit 官方没有 CI Action，安装只用官方脚本（与 copilot-setup-steps.yml 一致）。
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了要继续跑完另外两个，否则三平台差异会被 fail-fast 掩盖
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Install MoonBit (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          # `T234` 第二刀：钉 MoonBit 版本（本机 moon version 同值），不再追 latest。
          # 换版本须显式改这里并先在本地 `moon version` 验过，别让 CI 静默漂移。
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=0.1.20261104 bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          # `T234` 第二刀：钉 MoonBit 版本（与 unix 侧同值，靠 MOONBIT_INSTALL_VERSION）。
          $env:MOONBIT_INSTALL_VERSION="0.1.20261104"
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Show toolchain
        run: moon version --all

      # T194：runner 上的 registry index 是安装器带的快照，比 moonbitlang/async 的
      # 发布（2026-10-29 收录 0.22.6）旧——不先 `moon update`，moon check 在
      # "resolve registry dependency" 一步就报 "module was not found in the
      # registry"（本机曾用 /tmp 里复制的干净 MOON_HOME 逐字复现过）。本机能跑是
      # 因为 ~/.moon/registry/index 早被日常的 moon update 同步过了。
      - name: Update registry index
        run: moon update

      # 警告在本项目里是错误：unused_mut、partial_match 这类会直接改变 API 语义
      #
      # 门禁范围按目录下的包自动收集：新增一个 examples/ 或 tests/ 下的包会自动
      # 进闸门；backends/ 被有意排除（见文件头）。排除规则写在 scripts/ci-packages.sh
      # 里，和下面 wasm job 共用同一份口径。
      - name: Collect gated packages
        shell: bash
        run: |
          pkgs=$(bash scripts/ci-packages.sh packages examples tests _doccheck)
          echo "GATE_PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "gating: $pkgs"

      # 棘轮判据（T144）：几类"改过又长回来"的写法按文件记一个只降不升的
      # 计数。它只 grep 源码、不编译，三平台同值，所以在 core job 里跑一次就够
      # ——真后端的两个 C 文件也在这里被扫到（不编它们只读文本）。
      # 放在 check 之前：秒级先出结果，别让人等完几十秒编译才看到这条红。
      - name: Ratchet lints
        shell: bash
        run: bash scripts/detlint.sh

      # ABI 符号交叉核对（T145）：native-common 里 `extern "c"` 声明的每个
      # `moonui_*`，必须在本平台 adapter 的已定义符号里真的存在。声明只有一份、
      # C 分平台写，两边脱节只有真链接才暴露——而真链接只在本平台发生。
      # 每个平台只核它自己那一份：Linux 上两份都编不动（没有 Cocoa 的头），
      # 脚本会说"一份都没核（不是通过）"而不是假装绿。
      - name: ABI symbols
        shell: bash
        run: bash scripts/abi-symbols.sh

      - name: Check (warnings are errors)
        shell: bash
        run: moon check --deny-warn $GATE_PACKAGES

      - name: Test
        shell: bash
        run: moon test $GATE_PACKAGES

      # §49/§50 的 Demo 跑真事件循环，是唯一跨平台的端到端冒烟：
      # native 后端、句柄回收、布局数值都在这一条里过一遍。
      # §4 把 Demo 放在 examples/ 下、每个例子一个可执行包，所以这里逐个跑；
      # examples/common 是打印用的库包，不是可执行包，因此不在列表里。
      # examples/gallery-native 也不在：它要真窗口、真鼠标，CI 上两者都没有。
      # 固定 shell: bash：Windows 默认是 PowerShell，多行块里前面的失败会被吞掉。
      - name: Run demos (headless smoke test)
        shell: bash
        run: |
          for d in hello counter form todo file-manager; do
            echo "=== examples/$d ==="
            moon run "examples/$d"
          done

      # .mbti 与格式不进提交就等于没有：本地忘了跑 info/fmt 在这里暴露。
      # 拆成三个步骤而不是一个多行块：Windows 上默认 shell 是 PowerShell，
      # 块里前面的命令失败不会中断，只有最后一条的退出码决定成败，
      # 合并写会把 `moon fmt --check` 的失败吞掉。
      - name: Regenerate package interfaces
        shell: bash
        run: moon info $GATE_PACKAGES

      - name: Verify formatting
        run: moon fmt --check

      - name: Verify no drift in committed files
        run: git diff --exit-code

  # §47 第 6 条：Core 绝对不能出现 libui / GTK / SDL / Win32 / Cocoa。
  # 光靠注释提醒不住人，所以这条用 wasm 来证明：wasm 上根本没有 native FFI，
  # 只要 `moon test --target wasm` 能跑，Core + MockBackend 这一层就是干净的。
  # 唯一带 C stub 的 tests/ffi 包在 moon.pkg 里被门控成 native only，因此不计入。
  # backends/ 下那三个包也一样（native-common 的 ffi.mbt + backend.mbt + ABI 头
  # adapter.h、native-windows 与 native-macos 各自的测试文件，全部门控成 native
  # only），wasm 上它们都是空包，所以这条同时证明了"Core 干净"不依赖后端包是否
  # 存在。（`T82` 删 libui 后这条证明的对象只剩原生后端——将来真长出第二个后端，
  # 这条的形状原样可查 git log。）
  core-portability:
    name: Core is backend-free (wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Install MoonBit
        run: |
          # `T234` 第二刀：钉 MoonBit 版本（本机 moon version 同值），不再追 latest。
          # 换版本须显式改这里并先在本地 `moon version` 验过，别让 CI 静默漂移。
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=0.1.20261104 bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 同 core job：runner 的 registry index 快照可能比依赖的发布旧
      - name: Update registry index
        run: moon update

      # 不写死包名，但也不再是"整仓一条命令"：examples/gallery-native 是
      # native only 的可执行包，wasm 侧它没有 main，moon 直接报 4067。
      # 排除规则见脚本注释。
      - name: Collect packages
        shell: bash
        run: |
          pkgs=$(bash scripts/ci-packages.sh packages examples tests backends _doccheck)
          echo "WASM_PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "checking: $pkgs"

      - name: Check without native
        run: moon check --target wasm --deny-warn $WASM_PACKAGES

      - name: Test without native
        run: moon test --target wasm $WASM_PACKAGES

  # §48-22~24 的第一格：macOS 真后端的链接 + 真跑闸门（T6，2026-10-14 从只链接换
  # 上来）。这条测试命令就是 test-local.sh Darwin 分支那条（原生 Cocoa 14 条），
  # 本机全绿过才写进来的。hosted macOS runner 惯例带一个能连上 WindowServer 的
  # 会话（Xcode UI 测试就是这么跑的），但这个仓库没有 remote、workflow 从没真跑
  # 过——第一次跑如果红在"起不来 NSApplication"，退路是换回 `--build-only`
  # （T6 记着这条退路）。examples/gallery-native 仍只连不跑。
  #
  # 链接参数只有一份来源：仓库根 prebuild-link.js（moon.mod 的
  # `--moonbit-unstable-prebuild` 指过去，TODO `T59`），它把 backends/native-common
  # 的链接配置注入构建图、顺 import 传给这些可执行包——2026-10-11 之前每个壳各自
  # 抄一份 `cc-link-flags` 副本、副本会独自腐烂，副本已删。prebuild 由 node
  # 执行，CI 用 `actions/setup-node@v4` 钉 22（`T234`），只在 native/LLVM
  # 后端跑，`moon check` 跳过。
  #
  # 为什么不是 `moon build backends/native-macos`（听起来更直白的那条）：本机冷
  # target-dir 实测它是**红的**——库包没有 main，moon 仍然去链接，报
  # `Undefined symbols: _main`；不带 --target 的那条也一样失败。所以闸门写成
  # `moon test` 的形状。判据为什么落在"符号是 T 不是 U、load command 都在"而不
  # 是符号总数：README 那一格记着同一条限界（总数随 ABI 涨，别拿它当尺子）。
  # 闸门本身在 CI 上的第一次真跑仍然无法本地验证：本仓库没有 remote，workflow 得
  # 推上去才跑。
  macos-backend-link:
    name: macOS backend links and runs real-window tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Install MoonBit
        run: |
          # `T234` 第二刀：钉 MoonBit 版本（本机 moon version 同值），不再追 latest。
          # 换版本须显式改这里并先在本地 `moon version` 验过，别让 CI 静默漂移。
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=0.1.20261104 bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 同 core job：runner 的 registry index 快照可能比依赖的发布旧
      - name: Update registry index
        run: moon update

      - name: Show toolchain
        run: moon version --all

      # 全新 checkout 下 _build 本就不存在，这一步是防御性的：moon 不把平台 C
      # adapter 算成 native 测试目标的输入，runner 一旦复用构建缓存就会拿旧
      # 测试二进制报绿（T157 的坑）。与 scripts/test-local.sh 同一条纪律。
      - name: Clean stale native artifacts
        run: moon clean

      # T6 换上来的真跑：adapter_native.m 由 prebuild 现编（clang 由 macos
      # runner 自带的 Xcode 提供，darwin 这条路径不经 meson）。本机（有桌面）
      # 全绿过：14 条。脚手架全靠直接投消息，不需要真鼠标，但 NSApplication
      # 起不起得来要 runner 说了算——见上面 job 头的退路。
      - name: Run the native Cocoa backend real-window tests
        run: moon test --target native backends/native-macos

      - name: Link the native gallery (build only, never run)
        run: moon build --target native examples/gallery-native

  # §48-22~24 的第三格：Windows 真后端的闸门，`T78`（2026-10-22）起**真跑**测试
  # 二进制（36 条真窗口判据；本机 Windows 11 全绿过）。形状与上面的
  # `macos-backend-link` 对称：MSVC 开发环境排到 PATH 前头（压过 Git for
  # Windows 的 coreutils link.exe，T11 量过），adapter_native.c 由 prebuild-link.js
  # 现编。真窗口测试全靠 SendMessage/PostMessage 直投，不等真输入；runner 上
  # window station 给不给开桌面窗口没量过，红在那一步的退路是换回 --build-only
  # （T78 记着）。gallery-native 仍只连不跑（要真人关窗口才退出）。
  windows-backend-link:
    name: Windows backend links and runs real-window tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Install MoonBit (Windows)
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          # `T234` 第二刀：钉 MoonBit 版本（与 unix 侧同值，靠 MOONBIT_INSTALL_VERSION）。
          $env:MOONBIT_INSTALL_VERSION="0.1.20261104"
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Show toolchain
        run: moon version --all

      # 同 core job：runner 的 registry index 快照可能比依赖的发布旧
      - name: Update registry index
        run: moon update

      # 同 mac job：防 runner 复用构建缓存时拿旧测试二进制报绿（T157）。
      - name: Clean stale native artifacts
        shell: pwsh
        run: moon clean

      # 把 MSVC 的 bin（cl / link）排到 PATH 前头，压过 Git for Windows 的
      # coreutils link.exe——prebuild 现编 adapter_native.c 与测试二进制的链接
      # 才认得出真正的链接器。
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # `T234` 第二刀：钉 VC 工具集到 VS2022（windows-latest 自带），不再追 latest。
          version: '14.4x'

      - name: Run the native Win32 backend real-window tests
        shell: pwsh
        run: moon test --target native backends/native-windows

      - name: Link the native gallery (build only, never run)
        shell: pwsh
        run: moon build --target native examples/gallery-native

  # §48-22~24 的第二格：Linux / GTK4 真后端的链接 + 真跑闸门（`T235`，2026-11-08
  # 起落地）。形状与上面的 `macos-backend-link` / `windows-backend-link` 对称：
  # ubuntu 上 gcc 现编 backends/native-linux/adapter_native_gtk.c（prebuild 的
  # linux 分支），pkg-config 现取 gtk4/cairo 的编译与链接参数。P3 阶段那份
  # adapter 里窗口 / 事件循环 / 键盘 / 鼠标 / 手势、P4 阶段**画布 24 条**、P6-1
  # 阶段**控件挂载层 18 条**（`GtkOverlay`→`GtkFixed` 的窗口内容容器、Panel /
  # Custom 两种控件、attach/摆放/层叠/命中反查）、P6-2 阶段**剪贴板 2 条**
  # （`GdkClipboard`；读是异步的，那一片在 C 里泵临时 GMainLoop 到回调为止，
  # 上限 250ms）已是真实现；P5 阶段**音频 34 条**是"显式缺席"（`T237` 裁决③：
  # 音频不在框架承诺范围，所以不写 GStreamer，但也不当中性桩——按 adapter.h 的
  # 口径逐条给 -3 / 哨兵值，否则应用壳会把"没接"当成"装上了"）；P6-3 的**对话框与文件面板 8 条**
  # （`GtkMessageDialog` + `GtkFileChooserNative`——4.6 上唯一可用形态，GTK4 已没有
  # 同步的 run，靠临时 GMainLoop 等 response）也已落地；其余 139 个符号仍是中性桩。
  # 四片手写实现（`canvas_gtk.inc` 的 cairo、`widgets_gtk.inc` 的控件层、
  # `clipboard_gtk.inc` 的剪贴板、`dialogs_gtk.inc` 的对话框）都由生成物
  # #include 进同一个翻译单元。整个文件由 scripts/gen-native-linux-gtk.py 从
  # adapter.h 生成；本 job 是它**第一次被真编译器编、第一次被真链接**的地方——
  # 本机 macOS 只跑得动 scripts/mock-gtk-check.sh（语法 + 纯逻辑判据），GTK4 API
  # 用得对不对只有这里能证。真窗口判据在 P8 落地，xvfb 先装好、用 xvfb-run 包住，
  # 形状先定，P8 只补判据不补脚手架。
  #
  # 证据边界：本仓库没有 remote、workflow 从没真跑过，这条的第一次真跑仍无法本地
  # 验证——但和 mac/win 两端同形。
  #
  # 函数名这一层**已经在本机证过了**：scripts/gtk4-sysroot-check.sh 用真 GTK4 4.24
  # 头（从 brew bottle 解出的私有 sysroot）编过 adapter_native_gtk.c，零错误零警告，
  # 并另有一道 4.6 的最低版本闸（MIN_REQUIRED / MAX_ALLOWED 两个都设在 4.6；P6-3
  # 起这道闸也写进了生成物的 prelude，不再只靠这里的 -D）。第一跑这道就抓出 5 处
  # GTK3 遗留（gtk_main_iteration_do / gtk_events_pending / gtk_window_resize /
  # gdk_display_get_scale_factor / gtk_widget_hide 弃用），已全部改掉。
  # 画布这层更进一步：scripts/canvas-pixel-check.sh 在本机把 cairo / pango /
  # gdk-pixbuf 拼成私有可运行运行时、**真链接并真跑**了 34 条判据（33 绿 1 跳过：
  # 像素 17 + 控件结构 5 + 剪贴板 3 + 对话框 8，跳过的是 draw_image），所以 cairo
  # 的用法（预乘、坐标原点、渐变 offset 序、模糊遍序）也不在待证之列。同一道闸还
  # 覆盖 P6-1 的控件层结构、P6-2 的剪贴板写读与 P6-3 的消息框真应答（无显示器下
  # gtk_init_check 也成立，所以造控件 / attach / 摆放 / 层叠 / 摘挂 / 画布与控件
  # 共存 / 写进剪贴板再读回 / 点"确定·是·否"之后返回什么，都是真 GTK4 真跑）。
  # 文件面板那组要 GSettings schema：闸脚本自己在私有 sysroot 里编一份并挂到
  # XDG_DATA_DIRS，编不出来就 SKIP（缺 schema 时 GTK 是 g_error() 直接 abort，
  # 不能让判据来承担）。
  # 本 job 剩下的未知只有 linking / flags / xvfb 上屏这三样。
  # 控件层的"身份账"（登记表 / 命中反查 / 层叠序号）另有一层纯指针判据：
  # scripts/mock-gtk-check.sh 里搭了一棵假 widget 树，第 7 组 23 项真跑，四条
  # 负控制都点名变红；P6-3 又加了第 8 组 7 项（对话框 response → 返回码，钉住
  # "只有 YES 算同意"）。所以那一层剩下的未知只有真窗口上的分配与观感。
  # 所以这个 job 若红，**先看 linking 与 flags**（`pkg-config --libs gtk4 cairo`
  # 的路径、-ffunction-sections 与 dead-strip 的对称、xvfb 下的窗口能否上屏），
  # 不必再怀疑 API 名字或绘制算式。
  linux-backend-link:
    name: Linux (GTK4) backend links and runs real-window tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Install MoonBit
        run: |
          # `T234` 第二刀：钉 MoonBit 版本（本机 moon version 同值），不再追 latest。
          # 换版本须显式改这里并先在本地 `moon version` 验过，别让 CI 静默漂移。
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=0.1.20261104 bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 同 core job：runner 的 registry index 快照可能比依赖的发布旧
      - name: Update registry index
        run: moon update

      - name: Show toolchain
        run: moon version --all

      # `T235`：GTK4 后端要在 Linux 真机才编得动。ubuntu 自带 gcc/cc、ar、
      # pkg-config；这里补 GTK4 / Cairo / GStreamer 的开发头，prebuild 的
      # linuxNativeLinkFlags() 用 pkg-config 现取 gtk4/cairo 的链接参数。xvfb
      # 给无显示环境一个虚拟显示——P2 占位测试不依赖它，但 P8 的真窗判据要，
      # 这里一并装好、用 xvfb-run 包住，形状先定。
      - name: Install GTK4 / Cairo / GStreamer dev + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libcairo2-dev libgstreamer1.0-dev pkg-config xvfb xauth

      # 同 mac/win job：防 runner 复用构建缓存时拿旧测试二进制报绿（T157）。
      - name: Clean stale native artifacts
        run: moon clean

      # P2：adapter 是全 stub 骨架，这条只验"链接通过 + 占位测试绿"。xvfb-run
      # 包住（P8 真窗判据直接复用同一条，无需改脚手架）。
      - name: Run the native GTK4 backend real-window tests
        run: xvfb-run -a moon test --target native backends/native-linux

      - name: Link the native gallery (build only, never run)
        run: xvfb-run -a moon build --target native examples/gallery-native
