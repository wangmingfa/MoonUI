# 设计文档 §48 第 22/23/24 步：Windows、macOS、Linux 三平台 CI。
#
# 当前门禁的是 Core + MockBackend 这一层（§37 第一层）：布局、事件、句柄生命周期、
# Demo 全链路，加上 tests/ffi 这个自包含的 native FFI 探针（§48-02）。另外两个 job
# 都不做 native 链接：core 的清单压根没列 backends，core-portability 列了但走 wasm——
# 后端包的 .mbt 全部门控成 native，wasm 侧它们是空包，这正是 §47"Core 里不许出现
# GUI 库名字"要的证明。
#
# backends/ 下的真后端进闸门的形状两侧不同（2026-10-14 起）：
# `macos-backend-link` **真跑**真窗口的测试——`backends/native-macos`（原生 Cocoa
# 后端，14 条），examples/gallery-native 仍然只连不跑（它要真人关窗口才退出）；
# `windows-backend-link` 自 `T78`（2026-10-22）起同样**真跑** `backends/native-windows`
# （Win32 后端，36 条），gallery-native 仍只连不跑。`T82`（2026-10-15）删 libui 之后：
# build-libui.sh/.ps1 现编步、vendored 头
# 的 pin 闸门、六份 `-libui` 壳整体退场，链接参数只剩 prebuild-link.js 一份来源。
# mac 那批测试里的脚手架不需要前台归属也不动真光标（命中之后是往控件**直接投消
# 息**：BM_CLICK / SendMessageW(WM_CHAR) / PostMessageW(WM_CLOSE)，全仓库没有
# SendInput / SetCursorPos），真正可能卡住它们的只有 NSApplication 那一层——无头
# runner 上有没有能连上 WindowServer 的会话，本机（有屏、有桌面）答不出，job 第一次
# 真跑（本仓库没有 remote，要推上去才发生）如果红在起不来 NSApplication，退路是把
# 那两步换回 --build-only（T6 记着这条退路）。Windows 侧同理：runner 上起不起得来
# 真窗口没量过，退路同款（T78 记着）；hosted Windows runner 惯例带交互会话，且
# Windows 测试全部用 SendMessage/PostMessage 直投、不等真输入，大概率绿。
#
# Windows 这半的工具链装配：`ilammy/msvc-dev-cmd` 把 MSVC 的 bin 排到 PATH 前头
# （Git for Windows 的 coreutils `link.exe` 抢在 MSVC 链接器前面会让链接期的 cl
# 调用认错链接器，T11 量过；meson 那段随 build-libui.ps1 删掉）。adapter_native.c
# 由 prebuild-link.js 现编，编不出来时链接自己红、stderr 有完整构建日志。
#
# MoonBit 官方没有 CI Action，安装只用官方脚本（与 copilot-setup-steps.yml 一致）。
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了要继续跑完另外两个，否则三平台差异会被 fail-fast 掩盖
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      # 图标工具（2026-11-09 全仓去 Python）：只读仓库里现存的 Pillow 二进制产物 +
      # Node 内置 zlib，不碰任何平台 API，三平台都该绿。与 scripts/test-local.sh
      # 里那条是同一个判据，这里让 CI 也钉住"重渲实现没把图标画歪"。
      - name: Logo assets (pixel A/B)
        run: node scripts/logo-check.js

      - name: Install MoonBit (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          # `T234` 第二刀原本钉 `MOONBIT_INSTALL_VERSION=0.1.20261104`，2026-11-09 首跑
          # 即被证伪：那个 CDN 只服务通道名、不服务具体版本号——
          #   /binaries/{latest,nightly,pre-release}/moonbit-<target>.tar.gz → 200
          #   /binaries/0.1.20261104/…（与任意编造版本同一响应）            → 403
          # 所以"钉日期版本"不是防漂移，是让它 100% 装不上。改回通道名 `latest`，
          # 漂移改为**可观测**：紧跟其后的 `moon version --all` 会把实际版本打进日志。
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=latest bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          # 同上：CDN 不服务具体版本号（0.1.20261104 与编造版本同为 403），只认通道名。
          # 实际版本由后面的 `moon version --all` 记录。
          $env:MOONBIT_INSTALL_VERSION="latest"
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Show toolchain
        run: moon version --all

      # T194：runner 上的 registry index 是安装器带的快照，比 moonbitlang/async 的
      # 发布（2026-10-29 收录 0.22.6）旧——不先 `moon update`，moon check 在
      # "resolve registry dependency" 一步就报 "module was not found in the
      # registry"（本机曾用 /tmp 里复制的干净 MOON_HOME 逐字复现过）。本机能跑是
      # 因为 ~/.moon/registry/index 早被日常的 moon update 同步过了。
      - name: Update registry index
        run: moon update

      # 警告在本项目里是错误：unused_mut、partial_match 这类会直接改变 API 语义
      #
      # 门禁范围按目录下的包自动收集：新增一个 examples/ 或 tests/ 下的包会自动
      # 进闸门；backends/ 被有意排除（见文件头）。排除规则写在 scripts/ci-packages.sh
      # 里，和下面 wasm job 共用同一份口径。
      - name: Collect gated packages
        shell: bash
        run: |
          pkgs=$(bash scripts/ci-packages.sh packages examples tests _doccheck)
          echo "GATE_PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "gating: $pkgs"

      # 棘轮判据（T144）：几类"改过又长回来"的写法按文件记一个只降不升的
      # 计数。它只 grep 源码、不编译，三平台同值，所以在 core job 里跑一次就够
      # ——真后端的两个 C 文件也在这里被扫到（不编它们只读文本）。
      # 放在 check 之前：秒级先出结果，别让人等完几十秒编译才看到这条红。
      - name: Ratchet lints
        shell: bash
        run: bash scripts/detlint.sh

      # ABI 符号交叉核对（T145）：native-common 里 `extern "c"` 声明的每个
      # `moonui_*`，必须在本平台 adapter 的已定义符号里真的存在。声明只有一份、
      # C 分平台写，两边脱节只有真链接才暴露——而真链接只在本平台发生。
      # 每个平台只核它自己那一份：Linux 上两份都编不动（没有 Cocoa 的头），
      # 脚本会说"一份都没核（不是通过）"而不是假装绿。
      - name: ABI symbols
        shell: bash
        run: bash scripts/abi-symbols.sh

      # ubuntu 这一格也要编 native 后端：`$GATE_PACKAGES` 里的 examples/* 全是
      # native 包（§4 每个例子一个可执行包），而 Linux 的 adapter 由 prebuild 现编，
      # 没有 GTK4 头时先报 `<gtk/gtk.h> 找不到`，随后 prebuild 放弃生成
      # libadapter_native_gtk.a，链接期就变成几十个 `moonui_*` undefined（第一个
      # 是 moonui_native_time_ms）——把真因盖成"缺符号"（CI 首跑实测）。
      # mac/win 不需要这一步：Cocoa / Win32 的头是系统 SDK 自带。
      - name: Install GTK4 / Cairo dev + xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libcairo2-dev pkg-config xvfb xauth

      - name: Check (warnings are errors)
        shell: bash
        run: moon check --deny-warn $GATE_PACKAGES

      # Linux 上测试二进制链的是真 GTK4 adapter，跑起来要一个 display；xvfb 给一个。
      # mac/win 用各自的窗口服务，不包（包了反而多一层依赖）。
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a moon test $GATE_PACKAGES
          else
            moon test $GATE_PACKAGES
          fi

      # §49/§50 的 Demo 跑真事件循环，是唯一跨平台的端到端冒烟：
      # native 后端、句柄回收、布局数值都在这一条里过一遍。
      # §4 把 Demo 放在 examples/ 下、每个例子一个可执行包，所以这里逐个跑；
      # examples/common 是打印用的库包，不是可执行包，因此不在列表里。
      # examples/gallery-native 也不在：它要真窗口、真鼠标，CI 上两者都没有。
      # 固定 shell: bash：Windows 默认是 PowerShell，多行块里前面的失败会被吞掉。
      - name: Run demos (headless smoke test)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          for d in hello counter form todo file-manager; do
            echo "=== examples/$d ==="
            $RUN moon run "examples/$d"
          done

      # .mbti 与格式不进提交就等于没有：本地忘了跑 info/fmt 在这里暴露。
      # 拆成三个步骤而不是一个多行块：Windows 上默认 shell 是 PowerShell，
      # 块里前面的命令失败不会中断，只有最后一条的退出码决定成败，
      # 合并写会把 `moon fmt --check` 的失败吞掉。
      - name: Regenerate package interfaces
        shell: bash
        run: moon info $GATE_PACKAGES

      - name: Verify formatting
        run: moon fmt --check

      - name: Verify no drift in committed files
        run: git diff --exit-code

  # §47 第 6 条：Core 绝对不能出现 libui / GTK / SDL / Win32 / Cocoa。
  # 光靠注释提醒不住人，所以这条用 wasm 来证明：wasm 上根本没有 native FFI，
  # 只要 `moon test --target wasm` 能跑，Core + MockBackend 这一层就是干净的。
  # 唯一带 C stub 的 tests/ffi 包在 moon.pkg 里被门控成 native only，因此不计入。
  # backends/ 下那三个包也一样（native-common 的 ffi.mbt + backend.mbt + ABI 头
  # adapter.h、native-windows 与 native-macos 各自的测试文件，全部门控成 native
  # only），wasm 上它们都是空包，所以这条同时证明了"Core 干净"不依赖后端包是否
  # 存在。（`T82` 删 libui 后这条证明的对象只剩原生后端——将来真长出第二个后端，
  # 这条的形状原样可查 git log。）
  core-portability:
    name: Core is backend-free (wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Install MoonBit
        run: |
          # `T234` 第二刀原本钉 `MOONBIT_INSTALL_VERSION=0.1.20261104`，2026-11-09 首跑
          # 即被证伪：那个 CDN 只服务通道名、不服务具体版本号——
          #   /binaries/{latest,nightly,pre-release}/moonbit-<target>.tar.gz → 200
          #   /binaries/0.1.20261104/…（与任意编造版本同一响应）            → 403
          # 所以"钉日期版本"不是防漂移，是让它 100% 装不上。改回通道名 `latest`，
          # 漂移改为**可观测**：紧跟其后的 `moon version --all` 会把实际版本打进日志。
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=latest bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 同 core job：runner 的 registry index 快照可能比依赖的发布旧
      - name: Update registry index
        run: moon update

      # 不写死包名，但也不再是"整仓一条命令"：examples/gallery-native 是
      # native only 的可执行包，wasm 侧它没有 main，moon 直接报 4067。
      # 排除规则见脚本注释。
      - name: Collect packages
        shell: bash
        run: |
          pkgs=$(bash scripts/ci-packages.sh packages examples tests backends _doccheck)
          echo "WASM_PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "checking: $pkgs"

      - name: Check without native
        run: moon check --target wasm --deny-warn $WASM_PACKAGES

      - name: Test without native
        run: moon test --target wasm $WASM_PACKAGES

  # §48-22~24 的第一格：macOS 真后端的链接 + 真跑闸门（T6，2026-10-14 从只链接换
  # 上来）。这条测试命令就是 test-local.sh Darwin 分支那条（原生 Cocoa 14 条），
  # 本机全绿过才写进来的。hosted macOS runner 惯例带一个能连上 WindowServer 的
  # 会话（Xcode UI 测试就是这么跑的），但这个仓库没有 remote、workflow 从没真跑
  # 过——第一次跑如果红在"起不来 NSApplication"，退路是换回 `--build-only`
  # （T6 记着这条退路）。examples/gallery-native 仍只连不跑。
  #
  # 链接参数只有一份来源：仓库根 prebuild-link.js（moon.mod 的
  # `--moonbit-unstable-prebuild` 指过去，TODO `T59`），它把 backends/native-common
  # 的链接配置注入构建图、顺 import 传给这些可执行包——2026-10-11 之前每个壳各自
  # 抄一份 `cc-link-flags` 副本、副本会独自腐烂，副本已删。prebuild 由 node
  # 执行，CI 用 `actions/setup-node@v4` 钉 22（`T234`），只在 native/LLVM
  # 后端跑，`moon check` 跳过。
  #
  # 为什么不是 `moon build backends/native-macos`（听起来更直白的那条）：本机冷
  # target-dir 实测它是**红的**——库包没有 main，moon 仍然去链接，报
  # `Undefined symbols: _main`；不带 --target 的那条也一样失败。所以闸门写成
  # `moon test` 的形状。判据为什么落在"符号是 T 不是 U、load command 都在"而不
  # 是符号总数：README 那一格记着同一条限界（总数随 ABI 涨，别拿它当尺子）。
  # 闸门本身在 CI 上的第一次真跑仍然无法本地验证：本仓库没有 remote，workflow 得
  # 推上去才跑。
  macos-backend-link:
    name: macOS backend links and runs real-window tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Install MoonBit
        run: |
          # `T234` 第二刀原本钉 `MOONBIT_INSTALL_VERSION=0.1.20261104`，2026-11-09 首跑
          # 即被证伪：那个 CDN 只服务通道名、不服务具体版本号——
          #   /binaries/{latest,nightly,pre-release}/moonbit-<target>.tar.gz → 200
          #   /binaries/0.1.20261104/…（与任意编造版本同一响应）            → 403
          # 所以"钉日期版本"不是防漂移，是让它 100% 装不上。改回通道名 `latest`，
          # 漂移改为**可观测**：紧跟其后的 `moon version --all` 会把实际版本打进日志。
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=latest bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 同 core job：runner 的 registry index 快照可能比依赖的发布旧
      - name: Update registry index
        run: moon update

      - name: Show toolchain
        run: moon version --all

      # 全新 checkout 下 _build 本就不存在，这一步是防御性的：moon 不把平台 C
      # adapter 算成 native 测试目标的输入，runner 一旦复用构建缓存就会拿旧
      # 测试二进制报绿（T157 的坑）。与 scripts/test-local.sh 同一条纪律。
      - name: Clean stale native artifacts
        run: moon clean

      # T6 换上来的真跑：adapter_native.m 由 prebuild 现编（clang 由 macos
      # runner 自带的 Xcode 提供，darwin 这条路径不经 meson）。本机（有桌面）
      # 全绿过：14 条。脚手架全靠直接投消息，不需要真鼠标，但 NSApplication
      # 起不起得来要 runner 说了算——见上面 job 头的退路。
      - name: Run the native Cocoa backend real-window tests
        run: moon test --target native backends/native-macos

      - name: Link the native gallery (build only, never run)
        run: moon build --target native examples/gallery-native

  # §48-22~24 的第三格：Windows 真后端的闸门，`T78`（2026-10-22）起**真跑**测试
  # 二进制（36 条真窗口判据；本机 Windows 11 全绿过）。形状与上面的
  # `macos-backend-link` 对称：MSVC 开发环境排到 PATH 前头（压过 Git for
  # Windows 的 coreutils link.exe，T11 量过），adapter_native.c 由 prebuild-link.js
  # 现编。真窗口测试全靠 SendMessage/PostMessage 直投，不等真输入；runner 上
  # window station 给不给开桌面窗口没量过，红在那一步的退路是换回 --build-only
  # （T78 记着）。gallery-native 仍只连不跑（要真人关窗口才退出）。
  windows-backend-link:
    name: Windows backend links and runs real-window tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Install MoonBit (Windows)
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          # 同上：CDN 不服务具体版本号（0.1.20261104 与编造版本同为 403），只认通道名。
          # 实际版本由后面的 `moon version --all` 记录。
          $env:MOONBIT_INSTALL_VERSION="latest"
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Show toolchain
        run: moon version --all

      # 同 core job：runner 的 registry index 快照可能比依赖的发布旧
      - name: Update registry index
        run: moon update

      # 同 mac job：防 runner 复用构建缓存时拿旧测试二进制报绿（T157）。
      - name: Clean stale native artifacts
        shell: pwsh
        run: moon clean

      # 把 MSVC 的 bin（cl / link）排到 PATH 前头，压过 Git for Windows 的
      # coreutils link.exe——prebuild 现编 adapter_native.c 与测试二进制的链接
      # 才认得出真正的链接器。
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # `T234` 第二刀曾写 `version: '14.4x'` 想钉 VS2022，但这个 action 的
          # 有效输入只有 arch/sdk/spectre/toolset/uwp/vsversion——CI 每轮都报
          # "Unexpected input(s) 'version'"，那行从未生效；vswhere 实际选的是
          # runner 自带的 VS 18（2026-11-09 日志），Win32 真窗 52/52 与 gallery
          # 链接都是在那套工具集上跑通的。改成不钉、让 action 自己选，别把
          # 一个无效输入留在配置里假装钉住了（真要钉得用 vsversion，但那会换
          # 工具集，得先在 CI 上量过）。

      - name: Run the native Win32 backend real-window tests
        shell: pwsh
        run: moon test --target native backends/native-windows

      - name: Link the native gallery (build only, never run)
        shell: pwsh
        run: moon build --target native examples/gallery-native

  # §48-22~24 的第二格：Linux / GTK4 真后端的闸门（`T235`，2026-11-08 落地；
  # `P7` 起把本机那三道闸搬进 CI）。形状与上面的 `macos-backend-link` /
  # `windows-backend-link` 对称：ubuntu 上 gcc 现编
  # `backends/native-linux/adapter_native_gtk.c`（prebuild 的 linux 分支），
  # gtk4 / cairo 的头与库由 pkg-config 现取（发行版与多架构下硬编码必漏符号）。
  #
  # 下面这几层里，前三层就是本机天天跑的那三份脚本，只是宿主换成 ubuntu（③b 是 P9 新加的第四道闸，③c 是 T233 新加的第五道闸）：
  #   ① `scripts/mock-gtk-check.sh`  假头语法 + **367 项纯逻辑判据**（不碰真
  #      GTK，所以这一层在哪个宿主上都一样）。
  #   ② `scripts/gtk4-sysroot-check.sh`  真 GTK4 头下 `-fsyntax-only`，两档版本
  #      口径：默认档抓"GTK4 里根本没有这个函数"，4.6 min=max + `-Werror` 抓
  #      "用了比 Ubuntu 22.04 的 4.6 更新的 API"。Linux 上没有私有 sysroot，
  #      脚本自动回落 `pkg-config --cflags gtk4`。
  #   ③ `scripts/canvas-pixel-check.sh`  **真链接 + 真跑全部画布判据**（像素 17 /
  #      控件层 5 / 剪贴板 3 / 对话框 8 / 菜单 5 / 主题 4 / 无障碍 5 / 控件叶子
  #      5 + 5 / 七构造族 1 / 真窗 1 / 缩放口径 1；跳过的那条是 gdk-pixbuf 的 PPM 解码器）。控件那半
  #      要一个 display，所以用 xvfb-run 包住——脚本自己也会在无 DISPLAY 时
  #      `exec xvfb-run -a` 重入，两处是同一条保险：xvfb 起不来时 selftest 会把
  #      "因拿不到显示而跳过"单独计数并以非 0 退出，不许 SKIP 冒充 PASS。
  #   ③b `scripts/gtk-xinput-check.sh`  **外部真实输入**：xdotool 从另一进程经
  #      XTEST 发真 Tab / 真打字 / 真滚轮，验焦点按声明链走、滚轮 dy 反号。
  #      GTK4 公开头没有 GdkEvent 构造函数，这一层只在 X11 + xvfb 上成立。
  #   ③c `scripts/linux-gc-sections-check.sh`  **段回收成对**（T233 第三刀）：
  #      GNU ld 的 4 格 A/B（split/plain × gc/no-gc）证「编译分段 +
  #      --gc-sections 缺一不可」，静态断言钉住 prebuild-link.js 的接线；
  #      合成探针不碰 GTK4、不需要 display。ELF 产品 exe 的符号差集由 ④ 的
  #      gallery 链接间接验（真生效后链接必须仍成功）。
  #   ④ `moon test --target native backends/native-linux` + gallery 只连不跑。
  #      这一层才是"prebuild 把 adapter 编进链接图、native-common 的 FFI 调用
  #      在 Linux 上有落点"的端到端证明。真窗口判据 P8 已经写了，但在
  #      `canvas-pixel-selftest.c` 的 `t_p8_real_window` 里（C 层直接调 GTK，
  #      钉 present/mapped/按 scale 换算的分配尺寸/widget_size 两档/GTK 自己的焦点
  #      遍历/销毁后读 0）；`native_test.mbt` 仍是链接占位——事件真派发与 Tab 键
  #      真输入现在由 ③b 在 **C 层**用外部注射验（X11 上 xdotool），MoonBit 侧
  #      那一层仍未写。
  #
  # 实现账（P8 收口时）：`adapter.h` 的 264 个 `moonui_*` 里 real=39 /
  # impl=101 / absent=34 / 中性桩 91。absent 那 34 条是音频 31 + 媒体键/热键/
  # "正在播放" 3，按 `T237` 裁决③「音频由应用自担」逐条给 -3 与哨兵值（不是
  # `return 0` 那种谎报）；剩下 91 条桩里成片的是 19 WebView（要 WebKitGTK 外部
  # 依赖）。十一份手写 `*.inc` 都被生成物 `#include` 进同一个翻译单元，所以不新增
  # prebuild 编译单元，也不给链接期添符号。
  #
  # 证据边界（2026-11-10 订正）：本仓库没有 remote，这个 job 从 P2 建起来曾
  # **一次都没真跑过**；三轮修红（缺 GTK4 头 / GNU ld 库顺序 + `-fPIC` / 第二枚
  # `-lm` + canvas 闸假绿 + mac T103 噪声）之后，已由 owner 在 GitHub 上真跑并
  # 确认**全绿**。于是 ubuntu 上 linker/flags 的真实行为、xvfb 上屏、那一批画布判据
  # 在 X11 上的一致性都不再是未知；本机 mac 那份证据（当时 360 / 4.24+4.6 / 59-0-1，T241 之后是 367 / 60-0-1）
  # 仍然是「同一份脚本在另一宿主上真跑」。**仍未知**的是主题与字体在
  # Linux 上的观感（判据不测观感），以及 ③b 外部输入判据与 ③c 段回收闸的红绿
  # ——前者是 P9 这一轮才接进来的，后者是 T233 第三刀这一轮新加的；两者都要
  # 等下一次 CI 真跑才算数。T241 这一轮又改了生成物与判据数
  # （367 / 60），下一次 CI 会连这层一起验——本轮没有新的 CI 结果。真红了先看 helper.log 与 windowfocus，
  # 不必先怀疑 API 名字或绘制算式——那两层在本机已经各有闸了。
  linux-backend-link:
    name: Linux (GTK4) backend links and runs real-window tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `T234`：prebuild 由 node 执行，四个 job 统一钉 22（本机 v22.22.2 /
      # README 同档）并显式打印版本，防工具链漂移与四份 workflow 分叉。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Install MoonBit
        run: |
          # `T234` 第二刀原本钉 `MOONBIT_INSTALL_VERSION=0.1.20261104`，2026-11-09 首跑
          # 即被证伪：那个 CDN 只服务通道名、不服务具体版本号——
          #   /binaries/{latest,nightly,pre-release}/moonbit-<target>.tar.gz → 200
          #   /binaries/0.1.20261104/…（与任意编造版本同一响应）            → 403
          # 所以"钉日期版本"不是防漂移，是让它 100% 装不上。改回通道名 `latest`，
          # 漂移改为**可观测**：紧跟其后的 `moon version --all` 会把实际版本打进日志。
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION=latest bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 同 core job：runner 的 registry index 快照可能比依赖的发布旧
      - name: Update registry index
        run: moon update

      - name: Show toolchain
        run: moon version --all

      # `T235`：GTK4 后端要在 Linux 真机才编得动。ubuntu 自带 gcc/cc、ar 与
      # pkg-config；这里补 GTK4 / Cairo 的开发头——prebuild 的
      # linuxNativeLinkFlags / linuxNativeCompileFlags 都是现问 pkg-config。
      # 音频按 `T237` 裁决③ 不写 GStreamer，所以**不装** libgstreamer1.0-dev
      # （P5 那 34 条是显式缺席，不是待接）。
      # xvfb 给无显示环境一个虚拟显示：canvas-pixel 的控件判据现在就要，
      # P8 的真窗判据复用同一条 xvfb-run；P9 的外部输入判据还要 XTEST，
      # 所以补 xdotool（Wayland 没有 XTEST，脚本会在入口点名 SKIP/FAIL）。
      # openbox 是给 canvas 那一步的**窗口管理器**：X11 的 gtk_window_maximize
      # 只是一次请求，真正置位 _NET_WM_STATE_MAXIMIZED_* 的是 WM；裸 xvfb 没有
      # WM，P6-6 的最大化判据恒红（2026-11-11 CI 真跑就是这么红的）。选 openbox
      # 而不是 twm：twm 只讲 ICCCM，不认 EWMH 的那组状态位。
      - name: Install GTK4 / Cairo dev + xvfb + xdotool + openbox
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libcairo2-dev pkg-config xvfb xauth xdotool openbox

      # 同 mac/win job：防 runner 复用构建缓存时拿旧测试二进制报绿（T157）。
      - name: Clean stale native artifacts
        run: moon clean

      # ① 假头：语法 + 367 项纯逻辑判据。不需要显示，也不碰系统 GTK。
      - name: Mock gate (syntax + pure-logic criteria)
        run: bash scripts/mock-gtk-check.sh

      # ② 真 GTK4 头：两档版本口径。这一步抓的是"API 名字/签名用错"和"用了
      # 比 4.6 新的 API"，本机 mac 上同一份脚本已经抓过 6 处真实缺陷
      # （P3 的 5 处 GTK3 遗留 + P6-5c 的 GTK_DROPDOWN 拼写）。
      - name: Real GTK4 headers (two version tiers)
        run: bash scripts/gtk4-sysroot-check.sh

      # ③ 真链接 + 真跑：像素、控件层、剪贴板、对话框、菜单、主题、无障碍、
      # 控件叶子、焦点链、七构造族、真窗。这一层在本机 mac 上就已经是"真 GTK4 真跑"，
      # ubuntu 上的差别只有库的来源、xvfb 这个 display，以及 xvfb 里补起的那只
      # 窗口管理器（openbox：最大化等 WM 语义要有人兑现）。脚本里带 SKIP 护栏：
      # CI 环境缺件时直接 FAIL，那一批判据一条没跑不许报绿（2026-11-09 首跑
      # 就是静默 SKIP 过去的）；WM 没起来时最大化那条也会在 CI 下判红，不冒充绿。
      - name: Real link + real run (all canvas criteria under xvfb + openbox)
        run: |
          xvfb-run -a bash -c 'openbox --sm-disable >/dev/null 2>&1 & sleep 1; exec bash scripts/canvas-pixel-check.sh'

      # ③b 第四道闸：外部真实输入（T235 P9）。GTK4 公开头没有 GdkEvent
      # 构造函数（P8⑥ 查实），进程内合成不了真事件，所以 xdotool 从**另一个
      # 进程**经 XTEST 发真 Tab / Shift+Tab / 真打字 / 真滚轮，验焦点按声明链
      # 推进（不是 GTK 默认 z 序）、键盘事件与 Shift 位到账、滚轮 dy 反号。
      # 只在 X11 + xvfb 上成立；脚本带 SKIP 护栏，CI 缺件直接 FAIL。
      - name: External X11 input (Tab / wheel / typing via xdotool)
        run: xvfb-run -a bash scripts/gtk-xinput-check.sh

      # ③c 第五道闸：T233 第三刀。GNU ld 的 4 格 A/B（split/plain ×
      # gc/no-gc）证两枚 flag 必须成对，静态断言把仓库接线钉住。合成探针
      # 不碰 GTK4、不需要 display，所以不包 xvfb；CI 缺件 SKIP 一律 FAIL。
      - name: Linux section GC (T233 third cut)
        run: bash scripts/linux-gc-sections-check.sh

      # ④ 端到端：prebuild 现编 adapter、native-common 的 FFI 在 Linux 上有落点。
      # P8 的真窗判据在 ③ 的 `canvas-pixel-selftest.c::t_p8_real_window`（C 层
      # 直调 GTK），这里跑的 `native_test.mbt` 仍是链接占位；事件真派发与 Tab
      # 键真输入已由 ③b 在 C 层用外部注射验（xdotool / XTEST），MoonBit 侧
      # 那一层仍未写。
      - name: Run the native GTK4 backend real-window tests
        run: xvfb-run -a moon test --target native backends/native-linux

      - name: Link the native gallery (build only, never run)
        run: xvfb-run -a moon build --target native examples/gallery-native
