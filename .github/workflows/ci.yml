# 设计文档 §48 第 22/23/24 步：Windows、macOS、Linux 三平台 CI。
#
# 当前门禁的是 Core + MockBackend 这一层（§37 第一层）：布局、事件、句柄生命周期、
# Demo 全链路，加上 tests/ffi 这个自包含的 native FFI 探针（§48-02）。另外两个 job
# 都不做 native 链接：core 的清单压根没列 backends，core-portability 列了但走 wasm——
# 两个后端包的 .mbt 全部门控成 native，wasm 侧它们是空包，这正是 §47"Core 里不许出现
# GUI 库名字"要的证明。
#
# backends/ 下的真后端只有 macOS 那半进了闸门，而且**只到链接为止**——那是
# 第三个 job `macos-backend-link`，它先跑 scripts/build-libui.sh 现编 libui-ng 的
# 静态库（→ third-party/libui/lib/libui.a，产物不入库），再把六个 native 链接产物
# 连出来（后端包那份测试二进制 + `examples/` 下五份 `-native-macos` 可执行文件），
# 不执行、不开窗口。真窗口的测试（backends/libui-macos 那 22 条）还不在闸门里：
# 未知的是无头 runner 上起不起得来 NSApplication——有没有一个能连上 WindowServer 的
# 会话，本机（有屏、有桌面）答不出这个问题，只有这个 job 真跑绿一次才谈得上换上去。
#
# Windows 那半（backends/libui-windows + examples/hello-native）今天还进不来，缺的是工具链
# 装配：libui-ng 只有 meson 工程，既不发布预编译包也没有 CMake，而 runner 上那步
# `meson setup` 会先撞上 Git for Windows 自带的 coreutils `link.exe`（它抢在 MSVC 的
# 链接器前面，meson 直接 ERROR 停下），所以构建脚本得放进 VS 的开发环境里跑
# （`Launch-VsDevShell.ps1 -Arch amd64`，或 `ilammy/msvc-dev-cmd` 那类 action）。
# unix（GTK3）那半更早：`scripts/build-libui.sh` 开头就 `uname -s != Darwin` 明确 fail，
# 那条要 meson + ninja + pkg-config + 一套 GTK3 开发头，脚本还没写。
# §48 把真后端的三平台 CI 排在第 22~24 步，就是排在工具链装配之后——那时把
# backends/libui-windows（以及将来的 backends/libui-linux）也加进来，并按平台补上
# 各自的构建依赖。三个后端包的目录名现在是对称的：libui-common 是共用的 MoonBit，
# 每只平台一份 C 与一套 link。
#
# 同理，examples/ 下以 -native 结尾的可执行例子（examples/hello-native）也被排除：
# 它和 backends/libui-windows 是同一对依赖，而且还要一只会点鼠标的手。
#
# MoonBit 官方没有 CI Action，安装只用官方脚本（与 copilot-setup-steps.yml 一致）。
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了要继续跑完另外两个，否则三平台差异会被 fail-fast 掩盖
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Show toolchain
        run: moon version --all

      # 警告在本项目里是错误：unused_mut、partial_match 这类会直接改变 API 语义
      #
      # 门禁范围按目录下的包自动收集：新增一个 examples/ 或 tests/ 下的包会自动
      # 进闸门；backends/ 被有意排除（见文件头）。排除规则写在 scripts/ci-packages.sh
      # 里，和下面 wasm job 共用同一份口径。
      - name: Collect gated packages
        shell: bash
        run: |
          pkgs=$(bash scripts/ci-packages.sh packages examples tests _doccheck)
          echo "GATE_PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "gating: $pkgs"

      - name: Check (warnings are errors)
        shell: bash
        run: moon check --deny-warn $GATE_PACKAGES

      - name: Test
        shell: bash
        run: moon test $GATE_PACKAGES

      # §49/§50 的 Demo 跑真事件循环，是唯一跨平台的端到端冒烟：
      # native 后端、句柄回收、布局数值都在这一条里过一遍。
      # §4 把 Demo 放在 examples/ 下、每个例子一个可执行包，所以这里逐个跑；
      # examples/common 是打印用的库包，不是可执行包，因此不在列表里。
      # examples/hello-native 也不在：它要真窗口、真鼠标，CI 上两者都没有。
      # 固定 shell: bash：Windows 默认是 PowerShell，多行块里前面的失败会被吞掉。
      - name: Run demos (headless smoke test)
        shell: bash
        run: |
          for d in hello counter form todo file-manager; do
            echo "=== examples/$d ==="
            moon run "examples/$d"
          done

      # .mbti 与格式不进提交就等于没有：本地忘了跑 info/fmt 在这里暴露。
      # 拆成三个步骤而不是一个多行块：Windows 上默认 shell 是 PowerShell，
      # 块里前面的命令失败不会中断，只有最后一条的退出码决定成败，
      # 合并写会把 `moon fmt --check` 的失败吞掉。
      - name: Regenerate package interfaces
        shell: bash
        run: moon info $GATE_PACKAGES

      - name: Verify formatting
        run: moon fmt --check

      - name: Verify no drift in committed files
        run: git diff --exit-code

  # §47 第 6 条：Core 绝对不能出现 libui / GTK / SDL / Win32 / Cocoa。
  # 光靠注释提醒不住人，所以这条用 wasm 来证明：wasm 上根本没有 native FFI，
  # 只要 `moon test --target wasm` 能跑，Core + MockBackend 这一层就是干净的。
  # 唯一带 C stub 的 tests/ffi 包在 moon.pkg 里被门控成 native only，因此不计入。
  # backends/ 下那三个包也一样（libui-common 的 ffi.mbt + backend.mbt、libui-windows
  # 与 libui-macos 各自的测试文件，全部门控成 native only），wasm 上它们都是空包，
  # 所以这条同时证明了"Core 干净"不依赖后端包是否存在。
  core-portability:
    name: Core is backend-free (wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 不写死包名，但也不再是"整仓一条命令"：examples/hello-native 是 native only
      # 的可执行包，wasm 侧它没有 main，moon 直接报 4067。排除规则见脚本注释。
      - name: Collect packages
        shell: bash
        run: |
          pkgs=$(bash scripts/ci-packages.sh packages examples tests backends _doccheck)
          echo "WASM_PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "checking: $pkgs"

      - name: Check without native
        run: moon check --target wasm --deny-warn $WASM_PACKAGES

      - name: Test without native
        run: moon test --target wasm $WASM_PACKAGES

  # §48-22~24 的第一格：macOS 真后端的**链接**闸门。只链接、不开窗口。
  #
  # 为什么先只做到链接：未知的是在这个 job 上起不起得来 NSApplication——runner 有没有
  # 一个能连上 WindowServer 的会话，本机（有屏、有桌面）答不出。这一步连绿之后，下一步
  # 才是把 `moon test backends/libui-macos`（2026-10-10 本机 22 条真窗口的测试）换上来；那时真起不来，
  # 退回去也只退这一条命令。
  #
  # 两条链接命令各盖一份 link 配置：库包 backends/libui-macos 那份（它 moon.pkg 里的
  # `cc-link-flags` 那一行），和五个可执行包 examples/*-native-macos 里各自那份副本
  # ——MoonBit 的 link 不顺着 import 传，副本会独自腐烂，不编就没人发现它烂了。
  # 五个是 2026-10-10 从一条涨到五条的：hello 之外，`T28` 的 macOS 那半又建了
  # counter / form / todo / file-manager 四份，每份的 moon.pkg 都是同一串 flags 的又一份副本，
  # 所以这道闸门现在一次编五份副本；ABI 每动一次（`adapter.h` 加入口）这五份就一起重编一次。
  #
  # 为什么不是 `moon build backends/libui-macos`（听起来更直白的那条）：本机冷 target-dir
  # 实测它是**红的**——库包没有 main，moon 仍然去链接，报 `Undefined symbols: _main`；
  # 不带 --target 的那条也一样失败。所以闸门只能写成上面这两条形状。两条都在本机从空
  # target-dir 跑绿过，产物再用 nm / otool 对表（尺子不是我们自己的代码）：测试二进制里
  # 428 个 `_ui*`/`_uipriv*` 加 53 个 `_moonui_*`；例子的可执行文件里同样 428 个，加 49 个
  # 已定义的外部 `_moonui_*`（`adapter_macos.m` 里另有 4 个静态的），`_uiInit` 是 `T` 不是
  # `U`，`otool -L` 里 Cocoa / AppKit / libobjc 三条 load command 都在——即"这两条真的在
  # 链接现编的 libui.a 和那份 Cocoa adapter"，不是只编译通过。
  # 那个 49 是当时（ABI 49 条入口）的数，别再当现值用：2026-10-10 在本机把五份 `-native-macos`
  # 全量重编之后逐个数，五份都是 **84** 个已定义的 `_moonui_*`（= 现在 `adapter.h` 那 81 条入口
  # 加三条 mac 专用探针，探针不进 ABI 计数，形状见 TODO `T40`；`T42` 给 ABI 加的是按窗口的工作区
  # 那两条 `moonui_window_screen_*`；`T39` 的鼠标那一半加的是五条产品入口 `moonui_on_mouse` / `moonui_mouse_target` / `moonui_mouse_kind_button` / `moonui_mouse_pos` / `moonui_mouse_delta` 加一条测试脚手架 `moonui_send_mouse_in_window`），`_uiInit` 五份都是 `T`；
  # 同一批产物上 `nm -g | grep ' _ui\| _uipriv'` 是 276 行，不是当年那句"428 个"，
  # 那 428 用的是哪条命令没写下来——所以这条闸门的判据留给"`_uiInit` 是 `T`、`_moonui_*`
  # 全部已定义、三条 load command 都在"这三句，别拿总数当尺子（README 那一格记着同一条限界）。
  # 闸门本身在 CI 上的第一次真跑仍然无法本地验证：本仓库没有 remote，workflow 得推上去才跑。
  macos-backend-link:
    name: macOS backend links (no window)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      # libui.a 不入库，所以每次现编：一次 --depth 1 的 fetch 加几十个 clang 调用，
      # 一两分钟。clang 与 xcrun 由 macos runner 自带的 Xcode 提供；darwin 这条路径
      # 不经 meson（脚本头 :5-10 记了为什么），所以这个 job 不需要任何额外安装步骤。
      - name: Build libui-ng (Cocoa)
        run: bash scripts/build-libui.sh

      - name: Link the backend package (build only, never run)
        run: moon test --build-only --target native backends/libui-macos

      - name: Link the native examples (build only, never run)
        run: |
          moon build --target native \
            examples/hello-native-macos \
            examples/counter-native-macos \
            examples/form-native-macos \
            examples/todo-native-macos \
            examples/file-manager-native-macos

      # 顺带把 pin 钉住：build-libui.sh 每次从 pin 的检出无条件覆盖
      # backends/libui-macos/ui.h 与 ui_darwin.h（脚本 :122-123），这两份是入库的，
      # 所以内容对不上 pin 时这里就红——ABI 变了却没人重新审 adapter.h。
      # 这一步不是空转：本机跑过 `build-libui.sh -f` 全量重编，重编之后 git diff 里
      # 后端那两份头一条都不出现（= 入库内容与 pin 一致，闸门在健康树上是绿的）；
      # 比的是内容不是时间戳，所以脚本那两句 cp 弄脏 mtime 不会误报（Windows 侧那半
      # 的同类噪声记在 TODO.md）。
      # 行尾也一样被排除在判据之外：根目录的 .gitattributes 把这四份 vendored 头钉成
      # `text eol=lf`，因为 build-libui.ps1 那份 checkout 是 CRLF、这些副本还会经文件夹
      # 同步落到别的机器上，行尾-only 的差异会先把工作树报脏（mac 上真报到过两个 M）。
      # 在同样规则的独立空仓库里量过两面：只换行尾时 `git diff --quiet` 退出码 0，
      # 多加一行声明则 `git diff --exit-code` 退出码 1——也就是这道闸门仍然会为真 ABI
      # 变化红，只是不再为 \r 红。runner 上没量过（本仓库没有 remote，第一次真跑要推上去
      # 才发生），但那条 checkout 与入库的都是 LF，这条不依赖行尾归一化。
      - name: Verify vendored libui headers match the pin
        run: git diff --exit-code
