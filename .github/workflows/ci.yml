# 设计文档 §48 第 22/23/24 步：Windows、macOS、Linux 三平台 CI。
#
# 当前门禁的是 Core + MockBackend 这一层（§37 第一层）：布局、事件、句柄生命周期、
# Demo 全链路，加上 tests/ffi 这个自包含的 native FFI 探针（§48-02）。另外两个 job
# 都不做 native 链接：core 的清单压根没列 backends，core-portability 列了但走 wasm——
# 后端包的 .mbt 全部门控成 native，wasm 侧它们是空包，这正是 §47"Core 里不许出现
# GUI 库名字"要的证明。
#
# backends/ 下的真后端进闸门的形状两侧不同（2026-10-14 起）：
# `macos-backend-link` **真跑**真窗口的测试——`backends/native-macos`（原生 Cocoa
# 后端，14 条），examples/gallery-native 仍然只连不跑（它要真人关窗口才退出）；
# `windows-backend-link` 仍只到链接为止：后端包测试二进制与 gallery-native 只连
# 不跑。`T82`（2026-10-15）删 libui 之后：build-libui.sh/.ps1 现编步、vendored 头
# 的 pin 闸门、六份 `-libui` 壳整体退场，链接参数只剩 prebuild-link.js 一份来源。
# mac 那批测试里的脚手架不需要前台归属也不动真光标（命中之后是往控件**直接投消
# 息**：BM_CLICK / SendMessageW(WM_CHAR) / PostMessageW(WM_CLOSE)，全仓库没有
# SendInput / SetCursorPos），真正可能卡住它们的只有 NSApplication 那一层——无头
# runner 上有没有能连上 WindowServer 的会话，本机（有屏、有桌面）答不出，job 第一次
# 真跑（本仓库没有 remote，要推上去才发生）如果红在起不来 NSApplication，退路是把
# 那两步换回 --build-only（T6 记着这条退路）。Windows 侧的同形换法记在 TODO `T78`
# （真跑剩 native-windows 15 条，libui-windows 那半随 `T82` 失去对象）。
#
# Windows 这半的工具链装配：`ilammy/msvc-dev-cmd` 把 MSVC 的 bin 排到 PATH 前头
# （Git for Windows 的 coreutils `link.exe` 抢在 MSVC 链接器前面会让链接期的 cl
# 调用认错链接器，T11 量过；meson 那段随 build-libui.ps1 删掉）。adapter_native.c
# 由 prebuild-link.js 现编，编不出来时链接自己红、stderr 有完整构建日志。
#
# MoonBit 官方没有 CI Action，安装只用官方脚本（与 copilot-setup-steps.yml 一致）。
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了要继续跑完另外两个，否则三平台差异会被 fail-fast 掩盖
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Show toolchain
        run: moon version --all

      # 警告在本项目里是错误：unused_mut、partial_match 这类会直接改变 API 语义
      #
      # 门禁范围按目录下的包自动收集：新增一个 examples/ 或 tests/ 下的包会自动
      # 进闸门；backends/ 被有意排除（见文件头）。排除规则写在 scripts/ci-packages.sh
      # 里，和下面 wasm job 共用同一份口径。
      - name: Collect gated packages
        shell: bash
        run: |
          pkgs=$(bash scripts/ci-packages.sh packages examples tests _doccheck)
          echo "GATE_PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "gating: $pkgs"

      - name: Check (warnings are errors)
        shell: bash
        run: moon check --deny-warn $GATE_PACKAGES

      - name: Test
        shell: bash
        run: moon test $GATE_PACKAGES

      # §49/§50 的 Demo 跑真事件循环，是唯一跨平台的端到端冒烟：
      # native 后端、句柄回收、布局数值都在这一条里过一遍。
      # §4 把 Demo 放在 examples/ 下、每个例子一个可执行包，所以这里逐个跑；
      # examples/common 是打印用的库包，不是可执行包，因此不在列表里。
      # examples/gallery-native 也不在：它要真窗口、真鼠标，CI 上两者都没有。
      # 固定 shell: bash：Windows 默认是 PowerShell，多行块里前面的失败会被吞掉。
      - name: Run demos (headless smoke test)
        shell: bash
        run: |
          for d in hello counter form todo file-manager; do
            echo "=== examples/$d ==="
            moon run "examples/$d"
          done

      # .mbti 与格式不进提交就等于没有：本地忘了跑 info/fmt 在这里暴露。
      # 拆成三个步骤而不是一个多行块：Windows 上默认 shell 是 PowerShell，
      # 块里前面的命令失败不会中断，只有最后一条的退出码决定成败，
      # 合并写会把 `moon fmt --check` 的失败吞掉。
      - name: Regenerate package interfaces
        shell: bash
        run: moon info $GATE_PACKAGES

      - name: Verify formatting
        run: moon fmt --check

      - name: Verify no drift in committed files
        run: git diff --exit-code

  # §47 第 6 条：Core 绝对不能出现 libui / GTK / SDL / Win32 / Cocoa。
  # 光靠注释提醒不住人，所以这条用 wasm 来证明：wasm 上根本没有 native FFI，
  # 只要 `moon test --target wasm` 能跑，Core + MockBackend 这一层就是干净的。
  # 唯一带 C stub 的 tests/ffi 包在 moon.pkg 里被门控成 native only，因此不计入。
  # backends/ 下那三个包也一样（native-common 的 ffi.mbt + backend.mbt + ABI 头
  # adapter.h、native-windows 与 native-macos 各自的测试文件，全部门控成 native
  # only），wasm 上它们都是空包，所以这条同时证明了"Core 干净"不依赖后端包是否
  # 存在。（`T82` 删 libui 后这条证明的对象只剩原生后端——将来真长出第二个后端，
  # 这条的形状原样可查 git log。）
  core-portability:
    name: Core is backend-free (wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 不写死包名，但也不再是"整仓一条命令"：examples/gallery-native 是
      # native only 的可执行包，wasm 侧它没有 main，moon 直接报 4067。
      # 排除规则见脚本注释。
      - name: Collect packages
        shell: bash
        run: |
          pkgs=$(bash scripts/ci-packages.sh packages examples tests backends _doccheck)
          echo "WASM_PACKAGES=$pkgs" >> "$GITHUB_ENV"
          echo "checking: $pkgs"

      - name: Check without native
        run: moon check --target wasm --deny-warn $WASM_PACKAGES

      - name: Test without native
        run: moon test --target wasm $WASM_PACKAGES

  # §48-22~24 的第一格：macOS 真后端的链接 + 真跑闸门（T6，2026-10-14 从只链接换
  # 上来）。这条测试命令就是 test-local.sh Darwin 分支那条（原生 Cocoa 14 条），
  # 本机全绿过才写进来的。hosted macOS runner 惯例带一个能连上 WindowServer 的
  # 会话（Xcode UI 测试就是这么跑的），但这个仓库没有 remote、workflow 从没真跑
  # 过——第一次跑如果红在"起不来 NSApplication"，退路是换回 `--build-only`
  # （T6 记着这条退路）。examples/gallery-native 仍只连不跑。
  #
  # 链接参数只有一份来源：仓库根 prebuild-link.js（moon.mod 的
  # `--moonbit-unstable-prebuild` 指过去，TODO `T59`），它把 backends/native-common
  # 的链接配置注入构建图、顺 import 传给这些可执行包——2026-10-11 之前每个壳各自
  # 抄一份 `cc-link-flags` 副本、副本会独自腐烂，副本已删。prebuild 需要 PATH 里有
  # node（hosted runner 自带），只在 native/LLVM 后端跑，`moon check` 跳过。
  #
  # 为什么不是 `moon build backends/native-macos`（听起来更直白的那条）：本机冷
  # target-dir 实测它是**红的**——库包没有 main，moon 仍然去链接，报
  # `Undefined symbols: _main`；不带 --target 的那条也一样失败。所以闸门写成
  # `moon test` 的形状。判据为什么落在"符号是 T 不是 U、load command 都在"而不
  # 是符号总数：README 那一格记着同一条限界（总数随 ABI 涨，别拿它当尺子）。
  # 闸门本身在 CI 上的第一次真跑仍然无法本地验证：本仓库没有 remote，workflow 得
  # 推上去才跑。
  macos-backend-link:
    name: macOS backend links and runs real-window tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      # T6 换上来的真跑：adapter_native.m 由 prebuild 现编（clang 由 macos
      # runner 自带的 Xcode 提供，darwin 这条路径不经 meson）。本机（有桌面）
      # 全绿过：14 条。脚手架全靠直接投消息，不需要真鼠标，但 NSApplication
      # 起不起得来要 runner 说了算——见上面 job 头的退路。
      - name: Run the native Cocoa backend real-window tests
        run: moon test --target native backends/native-macos

      - name: Link the native gallery (build only, never run)
        run: moon build --target native examples/gallery-native

  # §48-22~24 的第三格：Windows 真后端的**链接**闸门。只链接、不开窗口。
  # 形状与上面的 `macos-backend-link` 对称（那边写全了，这里只记 Windows 自己的
  # 事）：MSVC 开发环境排到 PATH 前头（压过 Git for Windows 的 coreutils
  # link.exe，T11 量过），adapter_native.c 由 prebuild-link.js 现编（那条 cl 调
  # 用只写没验的账记在 TODO `T68`）。`T82` 之后 build-libui.ps1 与 meson/ninja
  # 安装步退场——libui.a 那条依赖链没了，工具链只剩 cl 一件事。
  #
  # 闸门在 CI 上的第一次真跑无法本地验证：本仓库没有 remote，workflow 得推上去才
  # 跑。写下来的命令形状是本机实测（adapter_native.c 的 mingw 交叉语法闸门在 mac
  # 上每日跑，test-local.sh 里）；runner 的 MSVC 版本对这份 C 会怎么反应没量过。
  windows-backend-link:
    name: Windows backend links (no window)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit (Windows)
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Show toolchain
        run: moon version --all

      # 把 MSVC 的 bin（cl / link）排到 PATH 前头，压过 Git for Windows 的
      # coreutils link.exe——prebuild 现编 adapter_native.c 与测试二进制的链接
      # 才认得出真正的链接器。
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Link the backend package (build only, never run)
        shell: pwsh
        run: moon test --build-only --target native backends/native-windows

      - name: Link the native gallery (build only, never run)
        shell: pwsh
        run: moon build --target native examples/gallery-native
